# arima.yaml — Auto ARIMA baseline
# Inherits all data/training defaults from base.yaml.
# ARIMA has no gradient training; epochs / batch_size are ignored.

model:
  name: arima
  max_p: 5
  max_q: 5
  max_d: 2
  seasonal: false
  n_fits: null              # null = fit all test trajectories; int to subsample
  n_samples: 500            # sample paths per trajectory for probabilistic eval
