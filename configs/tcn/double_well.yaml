data:
  train_data: "DATA/double_well_train.npz"
  test_data: "DATA/double_well_test.npz"
  L: 100
  H: 100
  train_stride: 5 
  val_stride: 5       
  retrieval_stride: 100
  train_test_split: 800

model:
  input_size: 1
  output_size: 100 # must match L
  num_channels: [32, 64, 32]      # much smaller
  kernel_size: 3
  dropout: 0.2
  use_reference: True
  k: 3

train:
  device: "cuda:0"
  batch_size: 128                   
  learning_rate: 0.001
  epochs: 30 #200
  grad_clip: 1.0
  num_workers: 1                   
  print_every: 10
  val_start: 800 ##includex context

path:
  encoder_path: "checkpoints/tcn/double_well.pth"
  vec_path: "references/double_well/embeddings.pt"
  futures_path: "references/double_well/futures.npy"
  ref_path: "references/double_well/indices.pt"
  training_curv: "checkpoints/tcn/double_well_loss.npz"