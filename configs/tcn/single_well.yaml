data:
  train_data: "DATA/single_well_train.npz"
  test_data: "DATA/single_well_test.npz"
  L: 100
  H: 100
  train_stride: 5 
  val_stride: 50       
  retrieval_stride: 20 #50 #10
  train_test_split: 800 ##only used in embedding training context

model:
  input_size: 1
  output_size: 100 # must match L
  num_channels: [16, 16, 32]      # much smaller
  kernel_size: 3
  dropout: 0.2
  use_reference: True
  k: 3

train:
  device: "cuda:0"
  batch_size: 128                   
  learning_rate: 0.0001
  epochs: 100
  grad_clip: 1.0
  num_workers: 1                   
  print_every: 10
  val_start: 800 ##includex context

path:
  encoder_path: "checkpoints/tcn/single_well.pth"
  vec_path: "references/single_well/embeddings.pt"
  futures_path: "references/single_well/futures.npy"
  ref_path: "references/single_well/indices.pt"
  training_curv: "checkpoints/tcn/single_well_loss.npz"