path:
  test_data: "DATA/single_well_test.npz"
  train_data: "DATA/single_well_train.npz"
  encoder_path: "checkpoints/tcn/single_well.pth"
  futures_path: "references/single_well/futures.npy"
  ref_path: "references/single_well/indices.pt"

retrieval:
  L: 100
  H: 100
  stride: 5 #for training RATD  must be tcn confg data.train_stride
  k: 3
  device: "cuda:0"

model:
  timeemb: 4 #128
  featureemb: 8 #16
  is_unconditional: false
  target_strategy: "test"
  use_reference: True
  num_sample_features: 1


diffusion:
  num_steps: 100 #50
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 50 
  schedule: "quad"
  ref_size: 100 
  h_size: 100
        
  channels: 2

  diffusion_embedding_dim: 8
  nheads: 1 
  layers: 2
  is_linear: True 


train:
  L: 100
  H: 100
  device: "cuda:0"
  batch_size: 32
  learning_rate: 1.0e-3
  epochs: 1000
  milestones: [600, 850]
  gamma: 0.1
  grad_clip: 1.0
  num_workers: 2
  print_every: 10
  val_start: 800 #200 #includes the context 
  val_every: 50 ##run evaluation every 50 
  path: "checkpoints/ratd/single_well"
  stride: 5 ##must match retreival_stride in tcn config
  train_size: 6000

forecast:
  test_size: 3000
  out_path: "results/ratd/single_well.npz"
  n_samples: 500