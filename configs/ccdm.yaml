# ccdm.yaml — CCDM (Contrastive Conditional Diffusion Model)
# ==============================================================
# Inherits all data/training defaults from base.yaml.
#
# Source: tsf_models-adam/configs/ccdm_train/double_well.yaml
#
# ⚠️  KNOWN ISSUE: tsf_models-adam/models/CCDM/ is currently empty.
#     The Python model files (network.py, diffusion.py, custom_model.py,
#     dataset_md.py) have not yet been committed to that directory.
#     CcdmModel will raise ImportError at instantiation time until those
#     files are present.  All other pipeline infrastructure (config, registry
#     entry, wrapper) is ready and will work once the files land.

model:
  name: ccdm
  # Encoder / decoder DiT stack depth
  n_emb: 2
  # Hidden dimensions for context encoder, latent encoder, step and time embeddings
  cont_hidden_dim: 128
  pred_hidden_dim: 128
  step_hidden_dim: 128
  time_hidden_dim: 128
  # DiT architecture
  n_depth: 2
  n_heads: 8
  attn_dropout: 0.1
  mlp_ratio: 1
  # Set true to replace attention with a linear layer (ablation only)
  non_attn: false
  # Diffusion schedule (nested under model so the registry wrapper can read it)
  diffusion_steps: 100
  beta_start: 0.0001
  beta_end: 0.2
  # Quadratic schedule (paper default)
  beta_schedule: quad
  # Predict noise ε (not y0)
  parameterization: noise
  # Uniform or non-uniform step sampling during training
  step_dist: uniform
  # Contrastive learning settings
  use_contrast: contrast
  contrast_weight: 0.0001
  n_negatives: 64
  temperature: 0.1

training:
  epochs: 500
  batch_size: 64
  learning_rate: 1.0e-3
