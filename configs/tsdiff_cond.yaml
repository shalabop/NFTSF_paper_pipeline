# tsdiff_cond.yaml — TSDiff-Cond (conditional / imputation variant)
# Inherits all data/training defaults from base.yaml.

model:
  name: tsdiff_cond
  diffusion_config: diffusion_small_config
  normalization: none
  use_features: false
  use_lags: false
  init_skip: false
  missing_scenario: forecast  # masks future steps during training
  missing_values: 0.0
  noise_observed: true

training:
  epochs: 1000
  batch_size: 64
  num_batches_per_epoch: 128
  eval_every: 50
  use_validation_set: true
