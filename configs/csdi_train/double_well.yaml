train:
  epochs: 2 #0
  batch_size: 64
  lr: 0.001
  itr_per_epoch: 128
  prediction_length: 100
  context_length: 100
  num_of_samples: 3 #100
  val_size: 2000
  test_size: 7 #30 #3000
  valid_epoch_interval: 50
  stride: 25
  training_curv: "checkpoints/csdi/double_well"
  normalization: "none"
  
diffusion:
  layers: 6 #4
  channels: 128 #64
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.01
  num_steps: 1000 #20 #400
  schedule: "quad"
  is_linear: True

model:
  is_unconditional: 0
  timeemb: 128
  featureemb: 16
  target_strategy: "test"
  normalization: "none" 
  num_sample_features: 1