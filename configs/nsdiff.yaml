# nsdiff.yaml — NsDiff (Neural SDE Diffusion)
# Inherits all data/training defaults from base.yaml.

model:
  name: nsdiff
  hidden_dim: 64
  num_layers: 3
  diffusion_steps: 50
  beta_start: 0.0001
  beta_end: 0.5

training:
  epochs: 1000
  batch_size: 64
  learning_rate: 1.0e-3
  early_stopping_patience: 50
  use_validation_set: true
