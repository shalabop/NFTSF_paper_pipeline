# tsdiff_q.yaml — TSDiff-Q (DDPM guidance, quantile refinement)
# Inherits all data/training defaults from base.yaml.

model:
  name: tsdiff_q
  diffusion_config: diffusion_small_config
  normalization: none       # Z-score applied by unified pipeline; disable internal scaling
  use_features: false
  use_lags: false
  init_skip: false
  guidance: ddpm            # "ddpm" | "ddim"
  guidance_scale: 1.0

training:
  epochs: 1000
  batch_size: 64
  num_batches_per_epoch: 128
  eval_every: 50
  use_validation_set: true
