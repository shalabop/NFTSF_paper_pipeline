# ratd.yaml — RATD (Reference-Aided Temporal Diffusion)
# Inherits all data/training defaults from base.yaml.

model:
  name: ratd
  channels: 64
  layers: 4
  nheads: 8
  diffusion_steps: 50
  beta_start: 0.0001
  beta_end: 0.5
  schedule: quad             # "quad" | "linear"
  target_strategy: mix       # "mix" | "hist" | "test"
  unconditional_rate: 0.1

training:
  epochs: 1000
  batch_size: 64
  learning_rate: 1.0e-3
  use_validation_set: true
