context_length: 100
prediction_length: 100
stride: 5 #25
test_size: 10 #5 #3000
val_size: 9000

train_curv: "checkpoints/nsdiff/alanine_phi/"

epochs: 10 #1000
batch_size: 64
lr: 0.001 #0.0001
patience: 20
valid_epoch_interval: 5 #50
num_of_samples: 500

normalization: "none"

diffusion_steps: 20 #100
beta_schedule: "linear"
beta_start: 0.0001
beta_end: 0.02

d_model: 32 #32 #16      
n_heads: 8 #2      
e_layers: 2 #2     
d_layers: 1 #1
d_ff: 16 #16 #32 #64 #128    
moving_avg: 25
factor: 3
distil: true
dropout: 0.05
activation: "gelu"

rolling_length: 96 #50 #100 #observed past for var estimator

k_z: 0.01
k_cond: 1 ##highe conditionaing??
d_z: 8 #6
CART_input_x_embed_dim: 32 #16
p_hidden_layers: 2


pretrain_mu_lr:      5e-4    # can be higher than diffusion lr
pretrain_mu_epochs:  200
pretrain_mu_patience: 30

pretrain_g_lr:       1e-4    # lower — variance is smoother signal
pretrain_g_epochs:   200
pretrain_g_patience: 30

pretrain_epochs:     200     # fallback if stage-specific not set