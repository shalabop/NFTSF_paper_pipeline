path:
  dataset_path: "training_data/double_well_std.npz"
  encoder_path: "tcn_weights/tcn_encoder_dw.pth"
  futures_path: "references/double_well/futures.npy"
  ref_path: "references/double_well/indices.pt"

retrieval:
  L: 100
  H: 100
  stride: 25 #for training RATD  must be tcn confg data.train_stride
  k: 3
  device: "cuda:0"

model:
  timeemb: 128
  featureemb: 16
  is_unconditional: false
  target_strategy: "test"
  use_reference: true
  num_sample_features: 1

diffusion:
  num_steps: 20  #100
  beta_start: 0.0001
  beta_end: 0.02
  schedule: "quad"
  ref_size: 100 #300 #100 k*H         # == context == L
  h_size: 100            # == prediction == H
  channels: 64
  diffusion_embedding_dim: 128
  nheads: 4 #2
  layers: 3
  is_linear: True

train:
  L: 100
  H: 100
  device: "cuda:0"
  batch_size: 64
  learning_rate: 0.001 #0.001 
  epochs: 150 #500
  milestones: [60, 85]
  gamma: 0.1
  grad_clip: 1.0
  num_workers: 2
  print_every: 10
  val_start: 200 #time step where val starts 
  val_every: 100 ##run evaluation every 50 
  path: "checkpoints/double_well"
  stride: 25

forecast:
  test_size: 10 #3000
  out_path: "results/ratd/test.npz"
  n_samples: 100