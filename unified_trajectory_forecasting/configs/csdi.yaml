# csdi.yaml — CSDI (Conditional Score-Based Diffusion for Imputation)
# Inherits all data/training defaults from base.yaml.

model:
  name: csdi
  channels: 64
  layers: 4
  nheads: 8
  diffusion_steps: 50
  diffusion_step_embed_dim_in: 128
  diffusion_step_embed_dim_mid: 512
  diffusion_step_embed_dim_out: 512
  beta_start: 0.0001
  beta_end: 0.5
  schedule: quad             # "quad" | "linear"

training:
  epochs: 1000
  batch_size: 64
  learning_rate: 1.0e-3
  use_validation_set: true
